        <nav class="burger-nav" id="burgerNav">
          <ul>
            <li id="userInfoMobile" style="display:none;">
              <span class="user-name" id="userEmailMobile"></span>
            </li>
            <li id="logoutMobile" style="display:none;">
              <button id="logoutBtnMobile" class="menu-btn">Выйти</button>
            </li>
            <li id="loginMobile">

            </li>
            <li><a href="/" class="menu-link">Главная</a></li>
            <li><a href="#" class="menu-link" id="favoritesMobile">⭐ Избранное</a></li>

    <div class="datetime" id="liveDateTime">--</div>
    <div class="group-switch" id="groupSwitch">
      <button class="group-btn active" data-group="mtb_parks">🚵 МТБ Парки</button>
      <button class="group-btn" data-group="mtb_mountains">🏔️ МТБ Горы</button>

      navigator.serviceWorker.register('/sw.js');
