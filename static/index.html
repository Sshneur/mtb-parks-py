<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Где Держак?</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="/lib/leaflet.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#0b0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Где Держак?">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <meta name="description" content="Проверь состояние грунта в МТБ-парках: сухо, мокро, болото или бетон. Прогноз погоды, фото грунта, оценки райдеров.">
  <meta property="og:title" content="Где Держак? — Состояние грунта на трассах">
  <meta property="og:description" content="Проверь состояние грунта в МТБ-парках: сухо, мокро, болото или бетон. Прогноз погоды, фото грунта, оценки райдеров.">
  <meta property="og:image" content="https://gripcheck.ru/og-image.jpg">
  <meta property="og:image:secure_url" content="https://gripcheck.ru/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://gripcheck.ru">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <script defer src="https://stats.gripcheck.ru/x.js" data-website-id="WEBSITE_ID" data-domains="gripcheck.ru,xn--80afdaebh7a3c.xn--p1ai" data-do-not-track="true"></script>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <h1 class="site-title">🚵 Состояние грунта трейлов</h1>
      <button id="themeToggle" class="theme-btn" aria-label="Сменить тему" style="position:absolute; right:0; background:none; border:none; font-size:1.3rem; cursor:pointer; padding:4px 8px; line-height:1;">🌙</button>
    </div>
    <div class="datetime" id="liveDateTime">--</div>
    <div class="group-switch" id="groupSwitch">
      <button class="group-btn active" data-group="mtb_parks">🚵 МТБ Парки</button>
      <button class="group-btn" data-group="mtb_mountains">🏔️ МТБ Горы</button>
      <button class="group-btn" data-group="pamps">🔄 Пампы</button>
      <button class="group-btn" data-group="favorites">⭐ Избранное</button>
    </div>
  </header>

  <div style="margin:10px 0; text-align:center; display:flex; align-items:center; justify-content:center; gap:6px;">
    <span style="font-size:0.8rem; color:var(--text-muted); font-weight:500;">OLD</span>
    <label class="ios-switch">
      <input type="checkbox" id="modelToggle">
      <span class="ios-slider"></span>
    </label>
    <span style="font-size:0.8rem; color:var(--text-muted); font-weight:500;">NEW</span>
  </div>

  <div class="mini-map-wrap" id="miniMapWrap">
    <div class="mini-map" id="miniMap"></div>
    <a href="/map" class="mini-map-link" id="miniMapFullLink" onclick="if(window.umami)umami.track('mini_map_full_click')">🗺️ Открыть полную карту →</a>
  </div>

  <main class="dashboard" id="dashboard">
    <div class="loading">⏳ Загрузка данных...</div>
  </main>
  <button class="refresh-btn" id="refreshBtn">🔄 Обновить данные</button>

  <!-- Плавающая кнопка меню -->
  <button class="fab-btn" id="fabBtn" aria-label="Меню">☰</button>

  <!-- Оверлей и меню -->
  <div class="fab-overlay" id="fabOverlay"></div>
  <nav class="fab-menu" id="fabMenu">
    <div class="fab-menu-handle"></div>
    <ul>
      <li id="userInfoMobile" style="display:none;">
        <span class="user-name" id="userEmailMobile"></span>
      </li>
      <li id="logoutMobile" style="display:none;">
        <button id="logoutBtnMobile" class="menu-btn">🚪 Выйти</button>
      </li>
      <li id="loginMobile">
        <a href="/login" class="menu-link">🔑 Войти</a>
      </li>
      <li><a href="/" class="menu-link">🏠 Главная</a></li>
      <li><a href="#" class="menu-link" id="favoritesMobile">⭐ Избранное</a></li>
      <li id="levelMobile" style="display:none;">
        <span class="menu-link" id="levelDisplay" style="cursor:default; color:#ffd966;">🎯 Уровень: 1 (оценок: 0)</span>
      </li>
      <li><a href="/garage" class="menu-link">🚲 Гараж</a></li>
      <li><a href="/map" class="menu-link">🗺️ Карта</a></li>
      <li><a href="/contacts" class="menu-link">📞 Контакты</a></li>
      <li><a href="/development" class="menu-link">🚀 Развитие проекта</a></li>
    </ul>
  </nav>


  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'light') document.documentElement.classList.add('theme-light');
      else if (!saved && window.matchMedia('(prefers-color-scheme:light)').matches) document.documentElement.classList.add('theme-light');
    })();
  </script>
  <script src="/lib/leaflet.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    var themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.textContent = document.documentElement.classList.contains('theme-light') ? '☀️' : '🌙';
      themeBtn.addEventListener('click', function() {
        document.documentElement.classList.toggle('theme-light');
        var isLight = document.documentElement.classList.contains('theme-light');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        themeBtn.textContent = isLight ? '☀️' : '🌙';
        // update meta theme-color
        var mc = document.querySelector('meta[name="theme-color"]');
        if (mc) mc.content = isLight ? '#d5dbe3' : '#0b0d14';
      });
    }

    var modelToggle = document.getElementById('modelToggle');
    if (modelToggle) {
      var savedModel = localStorage.getItem('model');
      if (savedModel === 'pm') modelToggle.checked = true;
      modelToggle.addEventListener('change', function() {
        var isPm = modelToggle.checked;
        localStorage.setItem('model', isPm ? 'pm' : 'standard');
        window.location.reload();
      });
    }
  </script>
</body>
</html>
